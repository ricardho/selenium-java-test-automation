# Default configuration. Override any key with -Dkey=value or an environment variable
# (e.g. base.url -> BASE_URL, sauce.password -> SAUCE_PASSWORD).

base.url=https://www.saucedemo.com
api.base.url=https://restful-booker.herokuapp.com

# chrome | firefox | edge
browser=chrome
headless=false
timeout.seconds=10

# Leave empty to run locally. Docker Grid: http://localhost:4444
grid.url=

# Secrets are intentionally NOT stored here (this file is versioned).
# Provide SAUCE_PASSWORD, API_USERNAME and API_PASSWORD through:
#   - a local .env file (git-ignored), created from .env.example
#   - environment variables / CI secrets (GitHub Actions: repository secrets)
